[package]
name = "cokacremote-manager"
version = "0.4.0-rc.1"
edition = "2021"
description = "Local-first macOS MCP operator console"
license = "MIT"

[lib]
name = "cokacremote_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
open = "5"
regex = "1"
