[package]
name = "cokacremote-manager"
version = "0.5.0-rc.2"
description = "Lightweight cross-platform MCP connection manager"
authors = ["cokacremote Desktop contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "cokacremote_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
regex = "1.12"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
sys-locale = "0.3"
