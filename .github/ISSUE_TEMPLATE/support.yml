name: Support / setup question
description: Ask for help with a publicly shareable, redacted installation or connection problem.
title: "[Support] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This is a **public GitHub issue**. Do not enter OAuth approval keys, access tokens, private URLs, private file paths or personal information.
        The first review target is **3–5 business days**, best effort, not guaranteed.
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 10/11
        - macOS Apple Silicon
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Manager version
      placeholder: e.g. Windows v0.3.0 / Mac v0.4.0-rc.2
  - type: textarea
    id: issue
    attributes:
      label: Problem or question (redacted)
      description: State expected and actual behavior, steps to reproduce and non-sensitive error text.
      placeholder: Avoid private identifiers and credentials.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public content review
      options:
        - label: I removed secrets, OAuth keys, personal information and private URLs from this public report.
          required: true
